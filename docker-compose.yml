services:
  postgres:
    image: postgres:16.6-alpine
    container_name: panenka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: panenka
      POSTGRES_PASSWORD: panenka_dev_password
      POSTGRES_DB: panenka_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - panenka-pgdata:/var/lib/postgresql/data
      - ./prisma/init-readonly-role.sql:/docker-entrypoint-initdb.d/01-readonly-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panenka -d panenka_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  panenka-pgdata:
    name: panenka-pgdata
